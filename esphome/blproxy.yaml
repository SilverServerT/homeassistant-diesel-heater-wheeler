substitutions:
  name: blproxyesp
  friendly_name: BLProxy
  heater_mac: "C8:17:F5:28:E7:9D"
  controller_code: "100000000"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  includes: [mudiro_warm_drive.h]

api:
  encryption:
    key: !secret api_encryption_key
  max_send_queue: 32
  on_client_connected:
    - delay: 2s
    - script.execute: mudiro_session
  services:
    - service: mudiro_write
      variables:
        hex: string
      then:
        - if:
            condition:
              binary_sensor.is_on: mudiro_connected
            then:
              - ble_client.ble_write:
                  id: mudiro_client
                  service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
                  characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
                  value: !lambda return mudiro_parse_hex(hex);

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  output_power: 20dB
  reboot_timeout: 0s

esp32:
  board: esp32dev
  cpu_frequency: 240mhz
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
    sdkconfig_options:
      CONFIG_BT_CTRL_COEX_PHY_CODED_TX_RX_TLIM: "0"
      CONFIG_BT_BLE_EST_SCAN_BAL_ENABLE: "y"

logger:
  level: INFO
  logs:
    mudiro: INFO
    esp32_ble_tracker: WARN
    bluetooth_proxy: WARN
    bluetooth_connection: WARN

esp32_ble:
  max_connections: 3

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true

# Off until the heater link is stable. Proxy + ble_client share one radio;
# HA diesel_heater through the proxy will steal this MAC.
bluetooth_proxy:
  active: false
  connection_slots: 1

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: mudiro_time

globals:
  - id: mudiro_password
    type: uint32_t
    restore_value: no
    initial_value: "${controller_code}"
  - id: mudiro_run_type
    type: uint8_t
    restore_value: no
    initial_value: "2"
  - id: mudiro_target
    type: uint8_t
    restore_value: no
    initial_value: "20"
  - id: mudiro_altitude
    type: uint16_t
    restore_value: no
    initial_value: "1"
  - id: mudiro_last_hex
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: mudiro_session_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

script:
  - id: mudiro_session
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (!id(mudiro_connected).state)
                return false;
              uint32_t now = millis();
              if (id(mudiro_session_ms) != 0 && (now - id(mudiro_session_ms)) < 10000)
                return false;
              id(mudiro_session_ms) = now;
              return true;
          then:
            - lambda: ESP_LOGI("mudiro", "session 5C/FF/5D");
            - ble_client.ble_write:
                id: mudiro_client
                service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
                characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
                value: !lambda |-
                  uint32_t ts = id(mudiro_time).now().is_valid() ? id(mudiro_time).now().timestamp : 0;
                  return mudiro_session_packet(0x5C, ts, id(mudiro_password));
            - delay: 500ms
            - ble_client.ble_write:
                id: mudiro_client
                service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
                characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
                value: !lambda |-
                  uint32_t ts = id(mudiro_time).now().is_valid() ? id(mudiro_time).now().timestamp : 0;
                  return mudiro_session_packet(0xFF, ts, id(mudiro_password));
            - delay: 500ms
            - ble_client.ble_write:
                id: mudiro_client
                service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
                characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
                value: !lambda |-
                  uint32_t ts = id(mudiro_time).now().is_valid() ? id(mudiro_time).now().timestamp : 0;
                  return mudiro_session_packet(0x5D, ts, id(mudiro_password));

ble_client:
  - mac_address: ${heater_mac}
    id: mudiro_client
    auto_connect: true
    on_connect:
      then:
        - binary_sensor.template.publish:
            id: mudiro_connected
            state: ON
        - lambda: ESP_LOGI("mudiro", "connected to ${heater_mac}");
        - esp32_ble_tracker.stop_scan:
        - delay: 500ms
        - script.execute: mudiro_session
    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: mudiro_connected
            state: OFF
        - lambda: ESP_LOGW("mudiro", "disconnected; auto_connect will retry");
        - esp32_ble_tracker.start_scan:
            continuous: true

text_sensor:
  - platform: ble_client
    ble_client_id: mudiro_client
    id: mudiro_rx
    internal: true
    service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
    characteristic_uuid: 0000FFF2-0000-1000-8000-00805F9B34FB
    notify: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            const std::string &raw = id(mudiro_rx).state;
            std::vector<uint8_t> bytes(raw.begin(), raw.end());
            if (bytes.size() >= 6 && bytes[0] == 0xA5) {
              id(mudiro_run_type) = bytes[4];
              id(mudiro_target) = bytes[5];
            }
            if (bytes.size() == 39 && bytes[0] == 0x5A && bytes[1] == 0x25) {
              id(mudiro_run_type) = bytes[34];
              id(mudiro_target) = bytes[15];
              id(mudiro_altitude) = (static_cast<uint16_t>(bytes[32]) << 8) | bytes[33];
            }
            id(mudiro_last_hex) = mudiro_to_hex(bytes);
            id(mudiro_last_hex_sensor).publish_state(id(mudiro_last_hex));
        - homeassistant.event:
            event: esphome.diesel_heater_notify
            data:
              address: ${heater_mac}
              payload: !lambda 'return id(mudiro_last_hex);'

  - platform: template
    name: "Mudiro last hex"
    id: mudiro_last_hex_sensor

binary_sensor:
  - platform: template
    name: "Mudiro BLE Connected"
    id: mudiro_connected
    device_class: connectivity

interval:
  - interval: 15s
    then:
      - if:
          condition:
            binary_sensor.is_on: mudiro_connected
          then:
            - ble_client.ble_write:
                id: mudiro_client
                service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
                characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
                value: !lambda |-
                  return mudiro_poll_packet(
                      id(mudiro_run_type), id(mudiro_target), id(mudiro_altitude));
