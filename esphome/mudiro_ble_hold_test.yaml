# Disable diesel_heater in HA while flashing this test firmware.
substitutions:
  name: mudiro-ble-test
  heater_mac: "C8:17:F5:28:E7:9D"
  controller_code: "100000000"

esphome:
  name: ${name}
  friendly_name: MUDIRO BLE test
  includes: [mudiro_warm_drive.h]

esp32:
  board: esp32dev
  framework: {type: esp-idf}

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  output_power: 20dB
  reboot_timeout: 0s

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true

time:
  - platform: sntp
    id: mudiro_time

globals:
  - id: mudiro_password
    type: uint32_t
    restore_value: no
    initial_value: "${controller_code}"
  - id: mudiro_run_type
    type: uint8_t
    restore_value: no
    initial_value: "2"
  - id: mudiro_target
    type: uint8_t
    restore_value: no
    initial_value: "20"
  - id: mudiro_altitude
    type: uint16_t
    restore_value: no
    initial_value: "1"
  - id: mudiro_notifies
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: mudiro_status_frames
    type: uint32_t
    restore_value: no
    initial_value: "0"

ble_client:
  - mac_address: ${heater_mac}
    id: mudiro_client
    auto_connect: true
    on_connect:
      then:
        - binary_sensor.template.publish:
            id: mudiro_connected
            state: ON
        - lambda: ESP_LOGI("mudiro", "connected to ${heater_mac}");
        - esp32_ble_tracker.stop_scan:
        - delay: 500ms
        - lambda: ESP_LOGI("mudiro", "handshake write 5C (config)");
        - ble_client.ble_write:
            id: mudiro_client
            service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
            characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
            value: !lambda |-
              uint32_t ts = id(mudiro_time).now().is_valid() ? id(mudiro_time).now().timestamp : 0;
              auto packet = mudiro_session_packet(0x5C, ts, id(mudiro_password));
              ESP_LOGD("mudiro", "TX %s", mudiro_to_hex(packet).c_str());
              return packet;
        - delay: 500ms
        - lambda: ESP_LOGI("mudiro", "handshake write FF (run settings)");
        - ble_client.ble_write:
            id: mudiro_client
            service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
            characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
            value: !lambda |-
              uint32_t ts = id(mudiro_time).now().is_valid() ? id(mudiro_time).now().timestamp : 0;
              auto packet = mudiro_session_packet(0xFF, ts, id(mudiro_password));
              ESP_LOGD("mudiro", "TX %s", mudiro_to_hex(packet).c_str());
              return packet;
        - delay: 500ms
        - lambda: ESP_LOGI("mudiro", "handshake write 5D (board info)");
        - ble_client.ble_write:
            id: mudiro_client
            service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
            characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
            value: !lambda |-
              uint32_t ts = id(mudiro_time).now().is_valid() ? id(mudiro_time).now().timestamp : 0;
              auto packet = mudiro_session_packet(0x5D, ts, id(mudiro_password));
              ESP_LOGD("mudiro", "TX %s", mudiro_to_hex(packet).c_str());
              return packet;
    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: mudiro_connected
            state: OFF
        - lambda: ESP_LOGW("mudiro", "disconnected; auto_connect will retry");
        - esp32_ble_tracker.start_scan:
            continuous: true

text_sensor:
  - platform: ble_client
    ble_client_id: mudiro_client
    id: mudiro_rx
    internal: true
    service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
    characteristic_uuid: 0000FFF2-0000-1000-8000-00805F9B34FB
    notify: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            const std::string &raw = id(mudiro_rx).state;
            std::vector<uint8_t> bytes(raw.begin(), raw.end());
            id(mudiro_notifies) += 1;
            const char *name = mudiro_frame_name(bytes);
            ESP_LOGI("mudiro", "notify #%u %s (%u bytes) %s",
                     static_cast<unsigned>(id(mudiro_notifies)), name,
                     static_cast<unsigned>(bytes.size()),
                     mudiro_to_hex(bytes).c_str());
            if (bytes.size() >= 6 && bytes[0] == 0xA5) {
              id(mudiro_run_type) = bytes[4];
              id(mudiro_target) = bytes[5];
            }
            if (bytes.size() == 39 && bytes[0] == 0x5A && bytes[1] == 0x25) {
              id(mudiro_status_frames) += 1;
              id(mudiro_run_type) = bytes[34];
              id(mudiro_target) = bytes[15];
              id(mudiro_altitude) = (static_cast<uint16_t>(bytes[32]) << 8) | bytes[33];
              id(mudiro_status_count).publish_state(id(mudiro_status_frames));
            }
            id(mudiro_last_frame).publish_state(name);
            id(mudiro_notify_count).publish_state(id(mudiro_notifies));

  - platform: template
    name: "Mudiro last frame"
    id: mudiro_last_frame

binary_sensor:
  - platform: template
    name: "Mudiro BLE Connected"
    id: mudiro_connected
    device_class: connectivity

sensor:
  - platform: template
    name: "Mudiro notify count"
    id: mudiro_notify_count
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "Mudiro 5A25 count"
    id: mudiro_status_count
    accuracy_decimals: 0
    update_interval: never

interval:
  - interval: 15s
    then:
      - if:
          condition:
            binary_sensor.is_on: mudiro_connected
          then:
            - ble_client.ble_write:
                id: mudiro_client
                service_uuid: 0000FFF0-0000-1000-8000-00805F9B34FB
                characteristic_uuid: 0000FFF1-0000-1000-8000-00805F9B34FB
                value: !lambda |-
                  auto packet = mudiro_poll_packet(
                      id(mudiro_run_type), id(mudiro_target), id(mudiro_altitude));
                  ESP_LOGD("mudiro", "keepalive poll TX %s", mudiro_to_hex(packet).c_str());
                  return packet;
